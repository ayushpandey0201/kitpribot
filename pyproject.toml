[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitpri"
version = "4.0.0"
description = "KitPri v4 - Cooking sound detection for Samsung SmartThings edge devices (PRISM Worklet 25ST31BMS)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
timm = ["timm>=0.9.12"]            # FP32 student / efficientnet builders
ast = ["transformers>=4.35"]       # AST teacher (training on Kaggle)
datagen = ["librosa>=0.10", "pandas>=2.0"]   # dataset builder (training/dataset_creation.py)

[tool.setuptools.packages.find]
where = ["src"]
