# Distillation experiment: AST teacher -> MobileNetV2 student.
# Original run: Modal A10G (training/distill_mobilenet.py).
include:
  - ../base.yaml
  - ../audio/mel_32k_10s.yaml
  - ../models/mobilenetv2_student.yaml

distillation:
  # NOT committed (329 MB > GitHub limit): retrain via training/train_ast.py
  # or copy from the Modal kitpri-checkpoints volume (kitpri_v4_ast_diagnostic/best_model.pt).
  teacher_checkpoint: runs/ast/ast_teacher.pt
  # Verified hyperparameters from results/kitpri_v4_distilled_mobilenet/run_summary.json:
  temperature: 3.0
  alpha: 0.4

training:
  epochs: 30
  batch_size: 16          # verified from training/distill_mobilenet.py (teacher forward runs alongside)
  lr: 3.0e-4
  weight_decay: 1.0e-4    # verified from training/distill_mobilenet.py
  scheduler: cosine
  early_stopping_patience: 6
  monitor: val_f1
  spec_augment:           # train-time only
    freq_mask_param: 27
    time_mask_param: 80
  # Reference outcome: best epoch 8, early stopped at 14.
